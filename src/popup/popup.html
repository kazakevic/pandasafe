<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PandaSafe</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="../../icons/icon-128.png" alt="" width="36" height="36" />
      <div>
        <h1>PandaSafe</h1>
        <p class="tagline">Calmer browsing, your rules</p>
      </div>
    </header>

    <main>
      <section class="card">
        <label class="setting">
          <span class="setting-text">
            <span class="setting-title">Block Shorts</span>
            <span class="setting-hint">Hides Shorts everywhere and sends Shorts links back home.</span>
          </span>
          <input type="checkbox" id="block-shorts" class="switch" role="switch" />
        </label>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>Blocked channels</h2>
          <span class="count" id="channel-count">0</span>
        </div>
        <p class="setting-hint">Their videos disappear from feeds and search, and their pages and videos won't open.</p>

        <button type="button" class="suggestion" id="block-current" hidden>
          <span class="suggestion-label">Block this channel</span>
          <span class="suggestion-name" id="block-current-name"></span>
        </button>

        <form class="add" id="add-form" autocomplete="off">
          <input
            type="text"
            id="add-input"
            placeholder="@handle or channel link"
            aria-label="Channel handle or link"
            spellcheck="false"
          />
          <button type="submit" id="add-button">Block</button>
        </form>
        <p class="status" id="status" role="status" aria-live="polite"></p>

        <ul class="channels" id="channel-list"></ul>
        <p class="empty" id="empty">No channels blocked yet.</p>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>Blocked websites</h2>
          <span class="count" id="site-count">0</span>
        </div>
        <p class="setting-hint">They won't open, including www. and other subdomains.</p>

        <button type="button" class="suggestion" id="block-site" hidden>
          <span class="suggestion-label">Block this site</span>
          <span class="suggestion-name" id="block-site-name"></span>
        </button>

        <form class="add" id="site-form" autocomplete="off">
          <input
            type="text"
            id="site-input"
            placeholder="example.com or any link"
            aria-label="Website domain or link"
            spellcheck="false"
            autocapitalize="off"
          />
          <button type="submit">Block</button>
        </form>
        <p class="status" id="site-status" role="status" aria-live="polite"></p>

        <ul class="channels" id="site-list"></ul>
        <p class="empty" id="site-empty">No websites blocked yet.</p>
      </section>
    </main>

    <template id="channel-item">
      <li class="channel">
        <span class="avatar" aria-hidden="true"></span>
        <span class="channel-text">
          <span class="channel-name"></span>
          <span class="channel-handle"></span>
        </span>
        <button type="button" class="remove" title="Unblock">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </li>
    </template>

    <template id="site-item">
      <li class="channel">
        <span class="avatar favicon" aria-hidden="true"><img alt="" /></span>
        <span class="channel-text">
          <span class="channel-name"></span>
        </span>
        <button type="button" class="remove" title="Unblock">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </li>
    </template>

    <script src="../shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
